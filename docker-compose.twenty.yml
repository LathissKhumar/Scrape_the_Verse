version: "3.8"

services:
  twenty-db:
    image: postgres:16-alpine
    container_name: twenty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: twenty_secure_password
      POSTGRES_DB: twenty
    volumes:
      - twenty_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twenty -d twenty"]
      interval: 5s
      timeout: 5s
      retries: 5

  twenty-server:
    image: twentycrm/twenty:latest
    container_name: twenty-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PG_DATABASE_URL: postgres://twenty:twenty_secure_password@twenty-db:5432/twenty
      SERVER_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      APP_SECRET: "agencyos_twenty_crm_super_secret_key_2026"
    depends_on:
      twenty-db:
        condition: service_healthy
    volumes:
      - twenty_server_data:/app/packages/twenty-server/.local-storage

volumes:
  twenty_db_data:
  twenty_server_data:
