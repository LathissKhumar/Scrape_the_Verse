[pytest]
testpaths = MicroServices/Lead_Manager/tests MicroServices/SDR/tests MicroServices/Voice_Agent/tests MicroServices/leadfinder/tests tests
norecursedirs = MicroServices/UI .* build dist
pythonpath = . MicroServices/leadfinder
markers =
    integration: mark test as integration test requiring external services like Ollama
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:Warning

