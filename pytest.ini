[pytest]
testpaths = MicroServices/leadfinder/tests tests
norecursedirs = MicroServices/SDR MicroServices/UI .* build dist
pythonpath = MicroServices MicroServices/leadfinder .
markers =
    integration: mark test as integration test requiring external services like Ollama
asyncio_mode = auto
filterwarnings =
    ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:Warning
